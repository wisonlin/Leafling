# Feature List
features:
  - title: Create With AI
    description: Describe an idea in natural language and turn it into a working local web app project.
    fontawesome_icon_name: magic

  - title: Preview Instantly
    description: Run generated HTML, CSS, and JavaScript inside Leafling's built-in iOS preview.
    fontawesome_icon_name: mobile-alt

  - title: Learn By Iterating
    description: Keep refining each project through chat and inspect how small changes affect the result.
    fontawesome_icon_name: code

  - title: Native Starters
    description: Try built-in examples that connect web apps to user-controlled iPhone capabilities.
    fontawesome_icon_name: plug

  - title: Local Projects
    description: Generated projects and files are stored on your device for private learning and prototyping.
    fontawesome_icon_name: folder-open

  - title: Bring Your Provider
    description: Configure your own compatible AI API key, base URL, and model in Settings.
    fontawesome_icon_name: key

