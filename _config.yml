# Feature List
features:
  - title: Try Ready-Made Examples
    description: Explore Photo Wall, Voice Note, and Leave Reminder before making your own tiny tool.
    fontawesome_icon_name: images

  - title: Make It Your Own
    description: Describe a personal tool or ask for changes to an example. Create and refine it through chat.
    fontawesome_icon_name: magic

  - title: Try Before Sign-In
    description: Preview official examples first. Connect an existing ChatGPT account to generate or edit apps; your account usage limits apply.
    fontawesome_icon_name: key

  - title: User-Triggered Access
    description: Photos and other native features are used only after you tap an action and grant permission.
    fontawesome_icon_name: mobile-alt

  - title: Keep Tiny Helpers
    description: Keep your personal tools on your device and reopen them from Apps inside Leafling.
    fontawesome_icon_name: folder-open

  - title: One-to-One Sharing
    description: Share a .leafling file directly. Imported apps open in Private Preview with sample data.
    fontawesome_icon_name: share-alt

